name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavitev Pythona (s pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Backend lint (Ruff)
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check .

      - name: Nastavitev Node.js (z npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint (ESLint)
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavitev Pythona (s pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Gradnja backenda
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          python -m compileall .
          mkdir -p build
          cp *.py requirements.txt Dockerfile build/

      - name: Shrani backend artefakt
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/

      - name: Nastavitev Node.js (z npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Gradnja frontenda
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Shrani frontend artefakt
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavitev Pythona (s pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Backend testi in pokritost kode (Pytest)
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pytest --cov=. --cov-report=xml --cov-report=term

      - name: Nastavitev Node.js (z npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend testi in pokritost kode
        working-directory: ./frontend
        run: |
          npm ci
          npm test | tee coverage-frontend.txt

      - name: Shrani poročilo o pokritosti kode
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage.xml
            frontend/coverage-frontend.txt
